name: network-service-composer

x-controller-common: &controller-common
  image: ${NSC_CONTROLLER_IMAGE:-nsc-controller:v0.1.0}
  build:
    context: .
    dockerfile: build/Dockerfile.controller
    args:
      VERSION: ${NSC_VERSION:-v0.1.0}
  restart: unless-stopped
  # Keep the image's numeric non-root UID; use the socket group as its primary
  # group so identical socket/secret GIDs do not duplicate group_add entries.
  user: "65532:${DOCKER_GID:-0}"
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  volumes:
    - ./config/controller.yaml:/etc/nsc/controller.yaml:ro
    - ./deploy/secrets/controller:/run/nsc:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
  environment: &controller-environment
    NSC_SECURITY__ADMIN_USERNAME: ${NSC_ADMIN_USERNAME:-admin}
    NSC_SECURITY__ADMIN_TOKEN: ${NSC_ADMIN_TOKEN:?set NSC_ADMIN_TOKEN}
    NSC_SECURITY__SESSION_KEY: ${NSC_SESSION_KEY:?set NSC_SESSION_KEY}
    NSC_SECURITY__PRIMARY_KEY_ID: v1
    NSC_SECURITY__ENCRYPTION_KEYS: '{"v1":"${NSC_ENCRYPTION_KEY_B64:?set NSC_ENCRYPTION_KEY_B64}"}'
    NSC_ACME__EMAIL: ${NSC_ACME_EMAIL:-}
    NSC_ACME__ACCEPT_TERMS: ${NSC_ACME_ACCEPT_TERMS:-false}
    NSC_I18N__DEFAULT_LANGUAGE: ${NSC_DEFAULT_LANGUAGE:-en}
    NSC_MANAGEMENT__ENABLED: ${NSC_MANAGEMENT_ENABLED:-false}
  networks:
    - control
    - nsc-ingress
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  group_add:
    - ${NSC_SECRET_GID:?set NSC_SECRET_GID}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
    interval: 5s
    timeout: 3s
    retries: 20

x-gateway-common: &gateway-common
  image: ${NSC_GATEWAY_IMAGE:-nsc-gateway:v0.1.0}
  build:
    context: .
    dockerfile: build/Dockerfile.gateway
    args:
      VERSION: ${NSC_VERSION:-v0.1.0}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
    - /etc/nginx:size=1m,uid=101,gid=101,mode=0750
    - /var/cache/nginx:size=64m,uid=101,gid=101,mode=0750
  volumes:
    - ./config/agent.yaml:/etc/nsc/agent.yaml:ro
    - ./deploy/secrets/gateway:/run/nsc:ro
    - gateway-state:/var/lib/nsc
  environment: &gateway-environment
    # Standalone Gateways read the elected Controller identity/address from
    # the same shared store. They never initialize or migrate that database.
    NSC_STORAGE__DRIVER: postgres
    NSC_STORAGE__DSN: postgres://nsc:${NSC_DATABASE_PASSWORD}@postgres:5432/nsc?sslmode=disable
    NSC_STORAGE__HA: "true"
    NSC_STORAGE__AUTO_MIGRATE: "false"
    NSC_AGENT__GATEWAY_ID: ${NSC_GATEWAY_ID:-gw_not-configured}
    NSC_AGENT__POOL_ID: ${NSC_POOL_ID:-pool_not-configured}
    NSC_AGENT__PUBLIC_ADDRESS: ${NSC_GATEWAY_PUBLIC_ADDRESS:-}
    NSC_NGINX__HTTP3_ADVERTISED_PORT: ${NSC_HTTPS_PORT:-443}
  ports:
    - "${NSC_HTTP_BIND:-0.0.0.0}:${NSC_HTTP_PORT:-80}:80"
    - "${NSC_HTTPS_BIND:-0.0.0.0}:${NSC_HTTPS_PORT:-443}:443"
    - "${NSC_HTTPS_BIND:-0.0.0.0}:${NSC_HTTPS_PORT:-443}:443/udp"
  networks:
    - control
    - nsc-ingress
  security_opt:
    - no-new-privileges:true
  sysctls:
    net.ipv4.ip_unprivileged_port_start: "0"
  cap_drop:
    - ALL
  group_add:
    - ${NSC_SECRET_GID:?set NSC_SECRET_GID}

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: nsc
      POSTGRES_USER: nsc
      POSTGRES_PASSWORD: ${NSC_DATABASE_PASSWORD:?set NSC_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsc -d nsc"]
      interval: 5s
      timeout: 3s
      retries: 20

  controller:
    <<: *controller-common
    environment:
      <<: *controller-environment
      NSC_STORAGE__DRIVER: postgres
      NSC_STORAGE__DSN: postgres://nsc:${NSC_DATABASE_PASSWORD}@postgres:5432/nsc?sslmode=disable
      NSC_STORAGE__HA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NSC_ADMIN_BIND:-0.0.0.0}:${NSC_ADMIN_PORT:-8080}:8080"
      - "${NSC_GRPC_BIND:-0.0.0.0}:${NSC_GRPC_PORT:-9443}:9443"
      - "127.0.0.1:${NSC_METRICS_PORT:-9090}:9090"

  gateway:
    <<: *gateway-common
    profiles: [gateway]
    depends_on:
      controller:
        condition: service_healthy

  gateway-sandbox:
    <<: *gateway-common
    profiles: [sandbox]
    environment:
      <<: *gateway-environment
      NSC_AGENT__MODE: sandbox
      NSC_NGINX__WORKER_PROCESSES: "1"
      NSC_NGINX__HTTP3_ADVERTISED_PORT: ${NSC_SANDBOX_HTTPS_PORT:-18443}
      NSC_AGENT__GATEWAY_ID: ${NSC_SANDBOX_GATEWAY_ID:-gw_not-configured}
      NSC_AGENT__POOL_ID: ${NSC_SANDBOX_POOL_ID:-pool_not-configured}
      NSC_AGENT__NAME: sandbox
    ports:
      - "${NSC_SANDBOX_BIND:-127.0.0.1}:${NSC_SANDBOX_HTTP_PORT:-18080}:80"
      - "${NSC_SANDBOX_BIND:-127.0.0.1}:${NSC_SANDBOX_HTTPS_PORT:-18443}:443"
      - "${NSC_SANDBOX_BIND:-127.0.0.1}:${NSC_SANDBOX_HTTPS_PORT:-18443}:443/udp"
    volumes:
      - ./config/agent.yaml:/etc/nsc/agent.yaml:ro
      - ./deploy/secrets/sandbox:/run/nsc:ro
      - sandbox-state:/var/lib/nsc
    depends_on:
      controller:
        condition: service_healthy

  mysql:
    image: mysql:8.4.11@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nsc
      MYSQL_USER: nsc
      MYSQL_PASSWORD: ${NSC_DATABASE_PASSWORD:?set NSC_DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NSC_DATABASE_PASSWORD:?set NSC_DATABASE_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  controller-mysql:
    <<: *controller-common
    profiles: [mysql]
    environment:
      <<: *controller-environment
      NSC_STORAGE__DRIVER: mysql
      NSC_STORAGE__DSN: "nsc:${NSC_DATABASE_PASSWORD}@tcp(mysql:3306)/nsc?parseTime=true&multiStatements=true&charset=utf8mb4"
      NSC_STORAGE__HA: "true"
      NSC_SERVER__PUBLIC_URL: http://controller-mysql:8080
      NSC_CONTROLLER__INTERNAL__URL: https://controller-mysql:9444
      NSC_CONTROLLER__INTERNAL__GRPC_ADDRESS: controller-mysql:9443
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${NSC_ADMIN_BIND:-0.0.0.0}:${NSC_ADMIN_PORT:-8080}:8080"
      - "${NSC_GRPC_BIND:-0.0.0.0}:${NSC_GRPC_PORT:-9443}:9443"
      - "127.0.0.1:${NSC_METRICS_PORT:-9090}:9090"

  gateway-mysql:
    <<: *gateway-common
    profiles: [mysql]
    environment:
      <<: *gateway-environment
      NSC_STORAGE__DRIVER: mysql
      NSC_STORAGE__DSN: "nsc:${NSC_DATABASE_PASSWORD}@tcp(mysql:3306)/nsc?parseTime=true&multiStatements=true&charset=utf8mb4"
      NSC_AGENT__CONTROLLER_ADDRESS: controller-mysql:9443
      NSC_AGENT__SERVER_NAME: controller-mysql
    volumes:
      - ./config/agent.yaml:/etc/nsc/agent.yaml:ro
      - ./deploy/secrets/gateway:/run/nsc:ro
      - gateway-mysql-state:/var/lib/nsc
    depends_on:
      controller-mysql:
        condition: service_healthy

  controller-sqlite:
    <<: *controller-common
    profiles: [sqlite]
    environment:
      <<: *controller-environment
      NSC_STORAGE__DRIVER: sqlite
      NSC_STORAGE__DSN: "file:/var/lib/nsc/nsc.db?_pragma=foreign_keys(1)&_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_time_format=sqlite"
      NSC_STORAGE__HA: "false"
      NSC_SERVER__PUBLIC_URL: http://controller-sqlite:8080
      NSC_CONTROLLER__INTERNAL__URL: https://controller-sqlite:9444
      NSC_CONTROLLER__INTERNAL__GRPC_ADDRESS: controller-sqlite:9443
      # Provision the Pool and Agent identity first, then enable this embedded
      # Gateway. A standalone Gateway cannot share SQLite leader ownership.
      NSC_CONTROLLER__LOCAL_GATEWAY: ${NSC_SQLITE_LOCAL_GATEWAY:-false}
      NSC_AGENT__MODE: production
      NSC_AGENT__GATEWAY_ID: ${NSC_GATEWAY_ID:-gw_not-configured}
      NSC_AGENT__POOL_ID: ${NSC_POOL_ID:-pool_not-configured}
      NSC_AGENT__NAME: sqlite-local-gateway
      NSC_AGENT__PUBLIC_ADDRESS: ${NSC_GATEWAY_PUBLIC_ADDRESS:-}
      NSC_AGENT__CONTROLLER_ADDRESS: controller-sqlite:9443
      NSC_AGENT__SERVER_NAME: controller-sqlite
      NSC_AGENT__CA_CERT_FILE: /run/nsc-agent/ca.crt
      NSC_AGENT__TLS_CERT_FILE: /run/nsc-agent/agent.crt
      NSC_AGENT__TLS_KEY_FILE: /run/nsc-agent/agent.key
      NSC_AGENT__STATE_DIR: /var/lib/nsc/gateway-state
      NSC_NGINX__GENERATION_DIR: /var/lib/nsc/gateway-state/generations
      NSC_NGINX__MAIN_CONFIG_PATH: /var/lib/nsc/gateway-state/nginx.conf
      NSC_NGINX__HTTP3_ADVERTISED_PORT: ${NSC_HTTPS_PORT:-443}
    volumes:
      - ./config/controller.yaml:/etc/nsc/controller.yaml:ro
      - ./deploy/secrets/controller:/run/nsc:ro
      - ./deploy/secrets/gateway:/run/nsc-agent:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - sqlite-data:/var/lib/nsc
    ports:
      - "${NSC_ADMIN_BIND:-0.0.0.0}:${NSC_ADMIN_PORT:-8080}:8080"
      - "${NSC_GRPC_BIND:-0.0.0.0}:${NSC_GRPC_PORT:-9443}:9443"
      - "127.0.0.1:${NSC_METRICS_PORT:-9090}:9090"
      - "${NSC_HTTP_BIND:-0.0.0.0}:${NSC_HTTP_PORT:-80}:80"
      - "${NSC_HTTPS_BIND:-0.0.0.0}:${NSC_HTTPS_PORT:-443}:443"
      - "${NSC_HTTPS_BIND:-0.0.0.0}:${NSC_HTTPS_PORT:-443}:443/udp"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=64m,uid=65532,gid=65532,mode=0750

networks:
  control:
    internal: true
  nsc-ingress:
    external: true
    name: ${NSC_INGRESS_NETWORK:-nsc-ingress}

volumes:
  sandbox-state:
  postgres-data:
  mysql-data:
  sqlite-data:
  gateway-state:
  gateway-mysql-state:
