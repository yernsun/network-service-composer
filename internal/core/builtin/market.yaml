      "description": {
        "en": "pgAdmin uses an administrator email and password on port 80. Set DATABASE_NETWORK to an existing PostgreSQL network. After signing in, register the database server manually; pgAdmin does not create a PostgreSQL server. Data: /var/lib/pgadmin.",
        "zh-CN": "pgAdmin 在 80 端口使用管理员邮箱和密码登录。DATABASE_NETWORK 指定已有 PostgreSQL 网络。登录后手动注册数据库服务器；pgAdmin 不创建 PostgreSQL 服务。数据：/var/lib/pgadmin。",
        "zh-TW": "pgAdmin 在 80 連接埠使用管理員信箱和密碼登入。DATABASE_NETWORK 指定既有 PostgreSQL 網路。登入後手動註冊資料庫伺服器；pgAdmin 不建立 PostgreSQL 服務。資料：/var/lib/pgadmin。",
        "ja": "pgAdmin はポート 80 で管理者メールとパスワードを使います。DATABASE_NETWORK に既存 PostgreSQL ネットワークを指定し、ログイン後に DB サーバーを手動登録します。PostgreSQL 自体は作成しません。データ: /var/lib/pgadmin。",
        "de": "pgAdmin nutzt an Port 80 Administrator-E-Mail und Passwort. DATABASE_NETWORK muss ein vorhandenes PostgreSQL-Netzwerk sein. Registrieren Sie nach der Anmeldung den Datenbankserver manuell; pgAdmin erstellt keinen PostgreSQL-Server. Daten: /var/lib/pgadmin.",
        "fr": "pgAdmin utilise un courriel administrateur et un mot de passe sur le port 80. DATABASE_NETWORK désigne un réseau PostgreSQL existant. Enregistrez ensuite le serveur manuellement ; pgAdmin ne crée pas de serveur PostgreSQL. Données : /var/lib/pgadmin.",
        "ru": "pgAdmin использует email администратора и пароль на порту 80. DATABASE_NETWORK задаёт существующую сеть PostgreSQL. После входа зарегистрируйте сервер вручную; pgAdmin не создаёт PostgreSQL. Данные: /var/lib/pgadmin.",
        "es": "pgAdmin usa correo y contraseña de administrador en el puerto 80. DATABASE_NETWORK debe ser una red PostgreSQL existente. Registre el servidor manualmente tras iniciar sesión; pgAdmin no crea PostgreSQL. Datos: /var/lib/pgadmin."
      },
