                "zh-TW": "選擇固定市場版本，閱讀參數並填寫自己的機密。密碼沒有可用預設值，至少使用 16 位元組。不要將真實機密提交到市場。",
                "fr": "Choisissez une version fixe du marché, lisez ses paramètres et saisissez vos propres secrets. Les mots de passe n’ont pas de valeur utilisable par défaut ; utilisez au moins 16 octets. Ne publiez aucun secret réel dans le marché.",
                "ru": "Выберите фиксированную версию, изучите параметры и введите свои секреты. У паролей нет пригодных значений по умолчанию; используйте не менее 16 байт. Не публикуйте настоящие секреты в каталоге.",
