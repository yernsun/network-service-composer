{
  "name": "PostgreSQL",
  "version": "18.6-alpine3.24",
  "description": "PostgreSQL — Compose template with persistent storage and explicit credentials",
  "variables": [
    {
      "key": "POSTGRES_PASSWORD",
      "required": true,
      "description": "Database password",
      "secret": true,
      "min_length": 16
    },
    {
      "key": "POSTGRES_USER",
      "required": false,
      "description": "Initial administrator (PostgreSQL creates this user as superuser)",
      "default": "app"
    },
    {
      "key": "POSTGRES_DB",
      "required": false,
      "description": "Initial database",
      "default": "app"
    }
  ]
}
