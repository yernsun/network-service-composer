services:
  database:
    image: mysql:8.4.11@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set root password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set application password}
    expose: ["3306"]
    volumes: ["database-data:/var/lib/mysql"]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  wordpress:
    entrypoint:
      - sh
      - -c
      - >-
        php -r '$$ok=false; mysqli_report(MYSQLI_REPORT_OFF); for($$i=0; $$i<60; $$i++){ $$db=@new mysqli("database",getenv("WORDPRESS_DB_USER"),getenv("WORDPRESS_DB_PASSWORD"),getenv("WORDPRESS_DB_NAME"),3306); if(!$$db->connect_errno){$$ok=true; break;} sleep(5); } exit($$ok?0:1);'
        && exec docker-entrypoint.sh apache2-foreground
    image: wordpress:7.1.0-php8.3-apache@sha256:5a93c470ae8220fddf71f6ebe3bc94e615ddc2ae4d9810f795b830fb11c41a17
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-app}
      WORDPRESS_DB_USER: ${MYSQL_USER:-app}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set application password}
    expose: ["80"]
    volumes: ["wordpress-data:/var/www/html"]
    healthcheck:
      test: [CMD, php, -r, "mysqli_report(MYSQLI_REPORT_OFF); exit(@mysqli_connect('database', getenv('WORDPRESS_DB_USER'), getenv('WORDPRESS_DB_PASSWORD'), getenv('WORDPRESS_DB_NAME')) && @file_get_contents('http://127.0.0.1/wp-includes/images/blank.gif') !== false ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  database-data: {}
  wordpress-data: {}
