# Independent channel: this endpoint belongs to your external incident receiver.
# It consumes Alertmanager payloads, not the NSC signed notification protocol.
route:
  receiver: external-operations
  group_by: [alertname, instance]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: external-operations
    webhook_configs:
      - url: https://alerts.example.test/alertmanager
        send_resolved: true
        http_config:
          follow_redirects: false
