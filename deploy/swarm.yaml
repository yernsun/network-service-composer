# Deploy with docker stack deploy, after provisioning every selected node.
# Node-local files have identical paths but DISTINCT identities and credentials.
version: "3.8"

x-policy: &policy
  parallelism: 1
  order: stop-first
  failure_action: pause
  max_failure_ratio: 0
  delay: 30s
  monitor: 30s

services:
  controller:
    image: ${NSC_CONTROLLER_IMAGE:?Set a tested Controller image digest}
    command: [serve, --config, /etc/nsc/controller.yaml]
    user: "65532:${NSC_DOCKER_GID:?Set the Docker socket GID shared by selected nodes}"
    read_only: true
    stop_grace_period: 30s
    environment:
      NSC_CONTROLLER__LOCAL_GATEWAY: "false"
      NSC_STORAGE__HA: "true"
      NSC_STORAGE__AUTO_MIGRATE: "false"
    volumes:
      - type: bind
        source: ${NSC_NODE_DIR:?Set an absolute provisioning directory}/controller.yaml
        target: /etc/nsc/controller.yaml
        read_only: true
      - type: bind
        source: ${NSC_NODE_DIR}/controller-secrets
        target: /run/nsc
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: tmpfs
        target: /tmp
    ports:
      - {target: 8080, published: 8080, protocol: tcp, mode: ingress}
      # Private, node-specific advertised endpoints; restrict using host firewall.
      - {target: 9443, published: 9443, protocol: tcp, mode: host}
      - {target: 9444, published: 9444, protocol: tcp, mode: host}
    networks: [control, ingress]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 3
    deploy:
      mode: global
      placement:
        constraints: ["node.labels.nsc.controller == true"]
      update_config: *policy
      rollback_config: *policy
      restart_policy: {condition: any, delay: 5s}

  gateway:
    image: ${NSC_GATEWAY_IMAGE:?Set a tested Gateway image digest}
    command: [--config, /etc/nsc/agent.yaml]
    read_only: true
    stop_grace_period: 30s
    environment:
      NSC_STORAGE__HA: "true"
      NSC_STORAGE__AUTO_MIGRATE: "false"
      NSC_NGINX__MAIN_CONFIG_PATH: /var/lib/nsc/nginx.conf
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - type: bind
        source: ${NSC_NODE_DIR}/agent.yaml
        target: /etc/nsc/agent.yaml
        read_only: true
      - type: bind
        source: ${NSC_NODE_DIR}/gateway-secrets
        target: /run/nsc
        read_only: true
      - type: bind
        source: ${NSC_NODE_DIR}/gateway-state
        target: /var/lib/nsc
      - type: tmpfs
        target: /tmp
      - type: bind
        source: ${NSC_NODE_DIR}/gateway-cache
        target: /var/cache/nginx
    ports:
      - {target: 80, published: 80, protocol: tcp, mode: ingress}
      - {target: 443, published: 443, protocol: tcp, mode: ingress}
      - {target: 443, published: 443, protocol: udp, mode: ingress}
    networks: [control, ingress]
    healthcheck:
      test: [CMD, /usr/local/bin/nsc-agent, --healthcheck, --config, /etc/nsc/agent.yaml]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      mode: global
      placement:
        constraints: ["node.labels.nsc.gateway == true"]
      update_config: *policy
      rollback_config: *policy
      restart_policy: {condition: any, delay: 5s}

networks:
  control:
    driver: overlay
    attachable: true
  ingress:
    external: true
    name: ${NSC_INGRESS_NETWORK:?Set the existing application overlay network}
