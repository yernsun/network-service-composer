# Run outside the NSC failure domain. Replace the example targets and mount the
# rules file next to this configuration. Do not route through an NSC Controller.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/ha-alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: nsc-controller
    static_configs:
      - targets: ['controller-a.example.test:9090', 'controller-b.example.test:9090', 'controller-c.example.test:9090']
  - job_name: nsc-external-ingress
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://entry-a.example.test/health', 'https://entry-b.example.test/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
