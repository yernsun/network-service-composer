name: Publish marketplace
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketplace-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Compile verified eight-language market
        env:
          MARKET_ENDPOINT: ${{ vars.MARKET_ENDPOINT || format('{0}/', steps.pages.outputs.base_url) }}
          MARKET_HOMEPAGE: ${{ vars.MARKET_HOMEPAGE || format('{0}/{1}', github.server_url, github.repository) }}
        run: go run ./cmd/nsc-market --official --endpoint "$MARKET_ENDPOINT" --homepage "$MARKET_HOMEPAGE" --output dist/market
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/market
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
