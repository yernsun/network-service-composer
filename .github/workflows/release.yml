name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Require the approved version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Require complete redistribution evidence
        run: node scripts/release/legal-check.mjs

  verify:
    name: All source-bound release checks
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    name: Release binaries
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.3
          cache: true
      - name: Set up Node for the embedded console
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded console
        run: make frontend-check
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME}"
          directory="nsc-${version}-${GOOS}-${GOARCH}"
          mkdir -p "/tmp/${directory}"
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${version}" -o "/tmp/${directory}/nsc-controller" ./cmd/nsc-controller
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${version}" -o "/tmp/${directory}/nsc-agent" ./cmd/nsc-agent
          cp README.md ARCHITECTURE.md LICENSE NOTICE THIRD_PARTY_NOTICES.md "/tmp/${directory}/"
          cp -R third_party "/tmp/${directory}/third_party"
          tar -C /tmp -czf "/tmp/${directory}.tar.gz" "${directory}"
          (cd /tmp && sha256sum "${directory}.tar.gz" > "${directory}.tar.gz.sha256")
      - name: Retain verified archive for final publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-binaries-${{ matrix.goarch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/nsc-*.tar.gz
            /tmp/nsc-*.sha256
          if-no-files-found: error

  images:
    name: Multi-architecture images
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: controller
            dockerfile: build/Dockerfile.controller
          - name: gateway
            dockerfile: build/Dockerfile.gateway
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up source evidence tools
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
      - name: Bind release source
        id: source
        run: node scripts/readiness/gate.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Set up ARM64 runtime emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nsc-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
      - name: Build immutable multi-architecture candidate once
        id: candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/nsc-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_FINGERPRINT=${{ steps.source.outputs.fingerprint }}
          provenance: mode=max
          sbom: true
      - name: Resolve the actual candidate architecture digests
        id: architectures
        env:
          NSC_IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
          NSC_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/nsc-${{ matrix.name }}
          NSC_IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p coverage/release
          docker buildx imagetools inspect --raw "$NSC_IMAGE_REPOSITORY@$NSC_IMAGE_DIGEST" > coverage/release/index.json
          node scripts/readiness/release-manifest.mjs select coverage/release/index.json "$NSC_IMAGE_DIGEST" "$NSC_IMAGE_REPOSITORY" "coverage/release/$NSC_IMAGE_NAME.json" >> "$GITHUB_OUTPUT"
      - name: Scan final amd64 image by digest
        id: scan_amd64
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.architectures.outputs.amd64 }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/nsc-trivy
          exit-code: '1'
      - name: Scan final arm64 image by digest
        id: scan_arm64
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.architectures.outputs.arm64 }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/nsc-trivy
          exit-code: '1'
      - name: Promote the same scanned index to the version tag
        env:
          NSC_IMAGE_NAME: ${{ matrix.name }}
          NSC_IMAGE_SCAN_RESULTS: '{"amd64":"${{ steps.scan_amd64.outcome }}","arm64":"${{ steps.scan_arm64.outcome }}"}'
        run: node scripts/readiness/release-manifest.mjs promote "coverage/release/$NSC_IMAGE_NAME.json"
      - name: Retain scanned and promoted image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-image-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/release/${{ matrix.name }}.json
          if-no-files-found: error

  create-release:
    name: Publish complete verified release
    needs: [verify, binaries, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/release-assets
          merge-multiple: true
      - name: Verify archives and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd coverage/release-assets
          test -f controller.json
          test -f gateway.json
          for architecture in amd64 arm64; do
            archive="nsc-${GITHUB_REF_NAME}-linux-${architecture}.tar.gz"
            test -f "$archive"
            test -f "$archive.sha256"
            expected=$(cut -d ' ' -f 1 "$archive.sha256")
            printf '%s  %s\n' "$expected" "$archive" | sha256sum --check
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz ./*.sha256 ./controller.json ./gateway.json --clobber
