openapi: 3.1.0
info:
  title: Network Service Composer API
  version: 0.1.0
  description: |
    Pool-scoped Docker and Swarm discovery, versioned Compose/Stack application
    deployment, application catalogs, routing, TLS, and gateway management.
    Localized responses negotiate en, ja, de, zh-CN, zh-TW, or fr from the nsc_locale
    Cookie and Accept-Language. Problem clients MUST use code and params as the
    machine contract; title and detail are localized human-readable text.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Gateway Pools
  - name: Runtimes
  - name: Services
  - name: Catalog
  - name: Applications
  - name: Operations
  - name: Domains
  - name: Routes
  - name: Certificates
  - name: Gateways
  - name: Settings
paths:
  /system/installation: {"get":{"operationId":"getSystemInstallation","description":"Administrator-only system maintenance. Exact installation ownership, plan revision, immutable release compatibility and idempotency are enforced. Never executes arbitrary commands.","parameters":[],"responses":{"200":{"description":"System installation response","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"$ref":"#/components/schemas/SystemInstallation"}},"required":["data"]}}}},"default":{"$ref":"#/components/responses/Problem"}}}}
  /system/installation/plans: {"post":{"operationId":"planSystemInstallation","description":"Administrator-only system maintenance. Exact installation ownership, plan revision, immutable release compatibility and idempotency are enforced. Never executes arbitrary commands.","parameters":[],"responses":{"201":{"description":"System installation response","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"$ref":"#/components/schemas/InstallationPlan"}},"required":["data"]}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InstallationPlanInput"}}}}}}
  /system/installation/operations: {"post":{"operationId":"startSystemInstallationOperation","description":"Administrator-only system maintenance. Exact installation ownership, plan revision, immutable release compatibility and idempotency are enforced. Never executes arbitrary commands.","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"}],"responses":{"202":{"description":"System installation response","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"$ref":"#/components/schemas/InstallationJob"}},"required":["data"]}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InstallationExecuteInput"}}}}}}
  /system/installation/operations/{operationID}: {"get":{"operationId":"getSystemInstallationOperation","description":"Administrator-only system maintenance. Exact installation ownership, plan revision, immutable release compatibility and idempotency are enforced. Never executes arbitrary commands.","parameters":[{"name":"operationID","in":"path","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"System installation response","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"$ref":"#/components/schemas/InstallationJob"}},"required":["data"]}}}},"default":{"$ref":"#/components/responses/Problem"}}}}
  /services/{id}/logs:
    get:
      operationId: followServiceLogs
      tags: [Services]
      summary: Follow Docker Swarm ServiceLogs over SSE
      description: Administrator only. Returns up to 200 recent lines by default and follows stdout and stderr without persistence. Compose services are unsupported.
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { name: tail, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        '200':
          description: SSE log and heartbeat frames
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /applications/{id}/source: {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getApplicationSource", "tags": ["Applications"], "description": "Confidential application source; authorized sensitive read required. Responses are never cached.", "responses": {"200": {"description": "Application source or encrypted draft", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/ApplicationSource"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /services/{id}/source: {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getServiceSource", "tags": ["Applications"], "description": "Service-scoped Confidential application source; authorized sensitive read required. Responses are never cached.", "responses": {"200": {"description": "Application source or encrypted draft", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/ApplicationSource"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /applications/{id}/revisions/{revisionID}/source: {"parameters": [{"$ref": "#/components/parameters/ID"}, {"name": "revisionID", "in": "path", "required": true, "schema": {"type": "string"}}], "get": {"operationId": "getApplicationRevisionSource", "tags": ["Applications"], "description": "Confidential application source; authorized sensitive read required. Responses are never cached.", "responses": {"200": {"description": "Application source or encrypted draft", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/ApplicationSource"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /applications/{id}/draft: {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getApplicationDraft", "tags": ["Applications"], "description": "Confidential application source; authorized sensitive read required. Responses are never cached.", "responses": {"200": {"description": "Application source or encrypted draft", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/ApplicationDraft"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}}, "put": {"operationId": "saveApplicationDraft", "tags": ["Applications"], "description": "Persist encrypted Compose/runtime.env without deployment. Requires the draft ETag (rev-0 when absent), current application revision and an idempotency key. Incomplete source may be saved; execution requires preflight.", "responses": {"200": {"description": "Application source or encrypted draft", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/ApplicationDraft"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}, "parameters": [{"$ref": "#/components/parameters/IfMatch"}, {"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApplicationDraftInput"}}}}}}
  /services/{id}/draft: {"parameters": [{"$ref": "#/components/parameters/ID"}], "get": {"operationId": "getServiceDraft", "tags": ["Applications"], "description": "Service-scoped Confidential application source; authorized sensitive read required. Responses are never cached.", "responses": {"200": {"description": "Application source or encrypted draft", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/ApplicationDraft"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}}, "put": {"operationId": "saveServiceDraft", "tags": ["Applications"], "description": "Service-scoped Persist encrypted Compose/runtime.env without deployment. Requires the draft ETag (rev-0 when absent), current application revision and an idempotency key. Incomplete source may be saved; execution requires preflight.", "responses": {"200": {"description": "Application source or encrypted draft", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/ApplicationDraft"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}, "parameters": [{"$ref": "#/components/parameters/IfMatch"}, {"$ref": "#/components/parameters/IdempotencyKey"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApplicationDraftInput"}}}}}}
  /services/{id}/delete:
    post:
      tags: [Services]
      operationId: deleteManagedService
      description: Permanently remove one owned running service from runtime and the active Compose source. Preserve volumes, revision history and certificate assets; disable existing routes. Refuses deletion of the last service.
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [acknowledge_data_boundary], properties: { acknowledge_data_boundary: { type: boolean, const: true } } } } } }
      responses:
        '202': { description: Queued deletion, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentOperationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /services/{id}/revisions/{revisionID}/restore-preview: {"post": {"operationId": "reviewServiceRestore", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "revisionID", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Service restore response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/ApplicationRestoreReview"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /services/{id}/restore: {"post": {"operationId": "restoreService", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"$ref": "#/components/parameters/IfMatch"}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string"}}], "responses": {"202": {"description": "Service restore response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/DeploymentOperation"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"review_id": {"type": "string"}, "acknowledge_data_boundary": {"type": "boolean"}}, "required": ["review_id", "acknowledge_data_boundary"]}}}}}}
  /environments/{id}/deployment-draft:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Applications]
      operationId: getEnvironmentDeploymentDraft
      description: Administrator-only, user-owned encrypted deployment wizard draft. Never cached.
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentDraftEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Applications]
      operationId: saveEnvironmentDeploymentDraft
      description: Save encrypted draft with optimistic concurrency; does not deploy.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, additionalProperties: true } } } } } }
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentDraftEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Applications]
      operationId: deleteEnvironmentDeploymentDraft
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Draft removed }
        default: { $ref: '#/components/responses/Problem' }
  /applications/{id}/revisions/{revisionID}/restore-preview: {"post": {"operationId": "reviewApplicationRestore", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "revisionID", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Application restore response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/ApplicationRestoreReview"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /applications/{id}/restore: {"post": {"operationId": "restoreApplication", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"$ref": "#/components/parameters/IfMatch"}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string"}}], "responses": {"202": {"description": "Application restore response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/DeploymentOperation"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"review_id": {"type": "string"}, "acknowledge_data_boundary": {"type": "boolean"}}, "required": ["review_id", "acknowledge_data_boundary"]}}}}}}
  /gateway-pools/{id}/nginx/releases/{releaseID}/verify: {"post": {"operationId": "verifyNginxRelease", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "releaseID", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "If-Match", "in": "header", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Identity response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/NginxRelease"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /activity: {"get": {"operationId": "listActivity", "parameters": [{"$ref": "#/components/parameters/Cursor"}, {"$ref": "#/components/parameters/Limit"}], "responses": {"200": {"description": "Community response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Activity"}}, "pagination": {"type": "object", "properties": {"next_cursor": {"type": "string"}, "limit": {"type": "integer"}}, "required": ["next_cursor", "limit"]}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /issues: {"get":{"operationId":"listIssues","parameters":[{"$ref":"#/components/parameters/Cursor"},{"$ref":"#/components/parameters/Limit"},{"name":"state","in":"query","schema":{"type":"string","enum":["all","active","resolved"]}},{"name":"resource_type","in":"query","schema":{"type":"string"}},{"name":"resource_id","in":"query","schema":{"type":"string"}},{"name":"environment_id","in":"query","schema":{"type":"string"}},{"name":"project_id","in":"query","schema":{"type":"string"}},{"name":"code","in":"query","schema":{"type":"string"}}],"responses":{"200":{"description":"Community response","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/Issue"}},"pagination":{"type":"object","properties":{"next_cursor":{"type":"string"},"limit":{"type":"integer"}},"required":["next_cursor","limit"]}},"required":["data"]}}}},"default":{"$ref":"#/components/responses/Problem"}}}}
  /issues/{issueID}/acknowledge: {"post": {"operationId": "acknowledgeIssue", "parameters": [{"name": "issueID", "in": "path", "required": true, "schema": {"type": "string"}}, {"$ref": "#/components/parameters/IfMatch"}], "responses": {"200": {"description": "Community response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/Issue"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /issues/{issueID}/responsibility: {"put":{"operationId":"assignIssueResponsibility","parameters":[{"name":"issueID","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/IfMatch"}],"responses":{"200":{"description":"Community response","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"$ref":"#/components/schemas/Issue"}},"required":["data"]}}}},"default":{"$ref":"#/components/responses/Problem"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["user_id"],"properties":{"user_id":{"type":"string"}}}}}}}}
  /gateways/{id}/evidence: {"get": {"operationId": "getGatewayEvidence", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Community response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/GatewayEvidence"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /users: {"get": {"operationId": "listUsers", "parameters": [], "responses": {"200": {"description": "Identity response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/User"}}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}, "post": {"operationId": "createUser", "parameters": [{"name": "X-NSC-Reauthenticate", "in": "header", "required": true, "schema": {"type": "string", "format": "password"}}], "responses": {"201": {"description": "Identity response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/User"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UserInput"}}}}}}
  /users/{userID}: {"put": {"operationId": "updateUser", "parameters": [{"name": "userID", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "If-Match", "in": "header", "required": true, "schema": {"type": "string"}}, {"name": "X-NSC-Reauthenticate", "in": "header", "required": true, "schema": {"type": "string", "format": "password"}}], "responses": {"200": {"description": "Identity response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/User"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UserInput"}}}}}}
  /users/{userID}/token: {"post": {"operationId": "rotateUserToken", "parameters": [{"name": "userID", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "If-Match", "in": "header", "required": true, "schema": {"type": "string"}}, {"name": "X-NSC-Reauthenticate", "in": "header", "required": true, "schema": {"type": "string", "format": "password"}}], "responses": {"200": {"description": "Identity response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "object", "properties": {"token": {"type": "string"}, "csrf_token": {"type": "string"}}, "required": ["token"]}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  /me/password:
    post:
      operationId: changeOwnPassword
      description: All signed-in users. Verifies the current password, invalidates old sessions and the legacy user Bearer token, and issues a fresh browser session and CSRF token. Project API keys remain valid.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [current_password, new_password], properties: { current_password: { type: string, format: password }, new_password: { type: string, format: password, minLength: 16, maxLength: 72 } } } } } }
      responses:
        '200': { description: Password changed, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/User' }, csrf_token: { type: string } } } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /users/{userID}/api-keys:
    parameters: [{ name: userID, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listUserAPIKeys
      description: Administrators and the owner may list metadata. Secret values are never returned after issuance.
      responses:
        '200': { description: Key metadata, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/OpenAPIKey' } } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: issueUserAPIKey
      description: Password reauthentication required. One user and one entire project, including future environments. A viewer issuing a key for themselves may select only read scopes; an administrator may grant a viewer limited write scopes.
      parameters: [{ name: X-NSC-Reauthenticate, in: header, required: true, schema: { type: string, format: password } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name, project_id, scopes], properties: { name: { type: string, minLength: 1, maxLength: 100 }, project_id: { type: string }, scopes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/UserAPIKeyScope' } } } } } } }
      responses:
        '201': { description: Key metadata and one-time secret, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/OpenAPIKeyIssued' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /users/{userID}/api-keys/{keyID}:
    delete:
      operationId: revokeUserAPIKey
      description: Administrators and the owner may revoke after password reauthentication and an exact key ETag. Scopes cannot be edited; issue a replacement key instead.
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
        - { name: keyID, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { name: X-NSC-Reauthenticate, in: header, required: true, schema: { type: string, format: password } }
      responses:
        '204': { description: Key revoked }
        default: { $ref: '#/components/responses/Problem' }
  /openapi-keys:
    get:
      operationId: listOpenAPIKeys
      summary: List deployment API keys
      description: Administrator only. Returns metadata; secret tokens are never returned again.
      responses:
        '200': { description: API key metadata, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/OpenAPIKey' } } } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: issueOpenAPIKey
      summary: Issue an environment-scoped deployment API key
      description: Administrator reauthentication required. The secret is returned once. A duplicate active name within the environment conflicts.
      parameters:
        - { name: X-NSC-Reauthenticate, in: header, required: true, schema: { type: string, format: password } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [name, environment_id], properties: { name: { type: string, minLength: 1, maxLength: 100 }, environment_id: { type: string } } } } } }
      responses:
        '201': { description: One-time secret and key metadata, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/OpenAPIKeyIssued' } } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /openapi-keys/{id}:
    delete:
      operationId: revokeOpenAPIKey
      summary: Revoke a deployment API key
      description: Administrator reauthentication and the key revision are required. Revocation takes effect on the next request.
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { name: X-NSC-Reauthenticate, in: header, required: true, schema: { type: string, format: password } }
      responses:
        '204': { description: Key revoked }
        default: { $ref: '#/components/responses/Problem' }
  /gateway-pools/{id}/nginx/releases/{releaseID}/stop: {"post": {"operationId": "stopNginxRelease", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "releaseID", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "If-Match", "in": "header", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Identity response", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/NginxRelease"}}, "required": ["data"]}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  "/overview": {"get": {"operationId": "getOverview", "responses": {"200": {"description": "Cached overview", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"type": "object", "required": ["resources", "cluster"], "properties": {"resources": {"type": "object", "additionalProperties": {"type": "integer"}}, "cluster": {"$ref": "#/components/schemas/NodeSummary"}}}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}}}
  "/overview/runtimes": {"get": {"operationId": "getOverviewRuntimes", "responses": {"200": {"description": "Cached overview", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/RuntimeSummary"}}, "pagination": {"$ref": "#/components/schemas/Pagination"}}}}}}, "default": {"$ref": "#/components/responses/Problem"}}, "parameters": [{"name": "limit", "in": "query", "schema": {"type": "integer", "default": 50, "minimum": 1, "maximum": 200}}, {"name": "cursor", "in": "query", "schema": {"type": "string"}}]}}
  "/runtimes/{id}/cluster": {
    "get": {
      "operationId": "cluster_overview",
      "tags": [
        "Runtimes"
      ],
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "history",
          "in": "query",
          "required": false,
          "schema": {
            "type": "boolean"
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Docker cluster observation. Missing metrics are never reported as zero.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ClusterOverviewEnvelope"
              }
            }
          }
        },
        "default": {
          "$ref": "#/components/responses/Problem"
        }
      }
    }
  }
  "/runtimes/{id}/cluster/nodes": {
    "get": {
      "operationId": "cluster_nodes",
      "tags": [
        "Runtimes"
      ],
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "history",
          "in": "query",
          "required": false,
          "schema": {
            "type": "boolean"
          }
        },
        {
          "name": "search",
          "in": "query",
          "required": false,
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "state",
