  "/environments/{id}/compose-validation": {
    "post": {
      "operationId": "validateEnvironmentCompose",
      "description": "Read-only Compose schema, storage and fresh placement analysis. Does not create reviews or deployments.",
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ComposeValidationInput"
            }
          }
        }
      },
      "responses": {
        "200": {
          "description": "Deployment diagnostics",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "data": {
                    "$ref": "#/components/schemas/ComposeValidationResult"
                  }
                },
                "required": [
                  "data"
                ]
              }
            }
          }
        },
        "default": {
          "description": "RFC 9457 error",
          "content": {
            "application/problem+json": {
              "schema": {
                "$ref": "#/components/schemas/Problem"
              }
            }
          }
        }
      }
    }
  }
  /environments/{id}/compose-preview:
    post:
      operationId: previewEnvironmentCompose
      description: Read-only administrator preview of the current Compose input with masked variable interpolation. Does not create a review or deployment.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComposeValidationInput' }
      responses:
        '200':
          description: Compose diagnostics and display-only rendered YAML
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ComposePreviewResult' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nsc_session
      description: Unsafe Cookie requests require the session X-CSRF-Token header.
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z]+_[0-9a-f-]{36}$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Resource ETag returned by GET, for example `"rev-3"`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Reusing a key on the same Runtime returns the original persistent operation.
      schema: { type: string, minLength: 1, maxLength: 255 }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: BCP 47 language preferences. The nsc_locale Cookie takes precedence for the management UI.
      schema: { type: string, example: 'zh-CN, en;q=0.8' }
  responses:
    Problem:
      description: RFC 9457 problem detail
      headers:
        Content-Language:
          description: Selected response language.
