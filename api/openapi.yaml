  /runtimes/{id}/docker-resources:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      tags: [Runtimes]
      operationId: listDockerResources
      description: Administrator-only Swarm Manager metadata and live Service references; never includes content.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [config, secret] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Paginated Docker resources, content: { application/json: { schema: { $ref: '#/components/schemas/DockerResourceCollection' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Runtimes]
      operationId: createDockerResource
      description: Queue immutable Swarm Config or Secret creation. Contents are encrypted until the operation reaches a terminal state.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DockerResourceCreate' } } } }
      responses:
        '202': { description: Queued operation with Location header, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentOperationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /runtimes/{id}/docker-resources/{resourceID}:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - { name: resourceID, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Runtimes]
      operationId: deleteDockerResource
      description: Queue deletion after fresh Manager dependency checks. Historical revisions may still require this name during restore.
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [config, secret] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [acknowledge_restore_risk], properties: { acknowledge_restore_risk: { type: boolean, const: true } } } } } }
      responses:
        '202': { description: Queued operation with Location header, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentOperationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /runtimes/{id}/volumes:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - { name: node_id, in: query, description: Required for Swarm; volumes are node-local., schema: { type: string } }
    get:
      tags: [Runtimes]
      operationId: listVolumes
      description: Administrator-only volume metadata and references. Retained offline inventory is read-only; driver options and volume contents are never returned.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [named, anonymous, unknown] } }
        - { name: usage, in: query, schema: { type: string, enum: [used, unused] } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Node-local volumes, content: { application/json: { schema: { $ref: '#/components/schemas/VolumeCollection' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Runtimes]
      operationId: createVolume
      description: Queue a plain local volume creation. An empty name creates an anonymous volume. Retries return the same operation and recover its actual generated name.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { name: { type: string, maxLength: 255 } } }
      responses:
        '202': { description: Queued operation, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentOperationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /runtimes/{id}/volumes/{name}:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: node_id, in: query, description: Required for Swarm., schema: { type: string } }
    get:
      tags: [Runtimes]
      operationId: getVolume
      responses:
        '200':
          description: Volume detail and identity fingerprint
          headers: { ETag: { schema: { type: string }, description: Identity fingerprint required for deletion. } }
          content:
            application/json:
              schema:
                type: object
                required: [data, observed_at, complete]
                properties:
                  data: { $ref: '#/components/schemas/Volume' }
                  observed_at: { type: string, format: date-time }
                  complete: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Runtimes]
      operationId: deleteVolume
      description: Queue individual non-force deletion of a verified unused local volume, including external volumes. Current or stopped container references, Service references, pending operations and restorable application data block removal.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [acknowledge_data_loss], properties: { acknowledge_data_loss: { type: boolean, const: true } } }
      responses:
        '202': { description: Queued operation, content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentOperationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
